name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke.py
      - run: python tools/test_runtime.py
      - run: python tools/test_textures.py
      - run: python tools/fetch_native_deps.py
      - run: python tools/test_shaders.py
      - run: python tools/build_installer.py
      - run: python tools/test_installer.py
